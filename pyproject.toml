[project]
name = "paper-pdf-translator"
version = "0.5.2"
description = "Translate research-paper PDFs into a layout-preserving PDF or a side-by-side reading page with AI questions. 把論文 PDF 翻成保留排版的 PDF，或左譯右原、可問 AI 的閱讀頁。"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "pdf2zh-next==2.9.0",
  "babeldoc==0.6.2",
  "pymupdf==1.25.2",
]

[project.scripts]
paper-translate = "paper_translate:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["paper_translate"]
