[project]
name = "paper-pdf-translator"
version = "0.4.0"
description = "把英文論文 PDF 翻成繁體中文並保留原版面；可用本機模型或 Claude、Codex 訂閱"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "pdf2zh-next==2.9.0",
  "babeldoc==0.6.2",
  "pymupdf==1.25.2",
]

[project.scripts]
paper-translate = "paper_translate:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["paper_translate"]
